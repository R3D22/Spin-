<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ الذكية</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
        }
        
        #wheel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            /* Add a nice border to the canvas */
            border: 8px solid #334155;
        }

        /* The pointer/arrow on the right side (0 degrees) */
        #pointer {
            position: absolute;
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 35px solid #ef4444; /* Tailwind red-500 */
            z-index: 10;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.3));
        }

        .modal-hidden {
            display: none !important;
        }

        .modal-visible {
            display: flex !important;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row items-center justify-center p-4 md:p-8 gap-8">

    
    <!-- Left side: Controls -->
    <div class="w-full md:w-1/3 max-w-md flex flex-col gap-4 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-3xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
            عجلة السحب
        </h1>
        
        <label for="namesList" class="text-sm font-bold text-slate-300">قائمة الأسماء (اسم في كل سطر):</label>
        <textarea id="namesList" rows="12" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none placeholder-slate-500" placeholder="أدخل الأسماء هنا..."></textarea>
        
        <button id="spinBtn" class="w-full py-4 text-xl font-bold bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white rounded-xl shadow-[0_5px_0_#1e3a8a] active:shadow-[0_0px_0_#1e3a8a] active:translate-y-[5px] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
            لف العجلة!
        </button>
    </div>

    <!-- Right side: Wheel -->
    <div class="w-full md:w-1/2 max-w-2xl flex justify-center items-center">
        <div id="wheel-container">
            <div id="pointer"></div>
            <canvas id="wheel"></canvas>
        </div>
    </div>

    <!-- Winner Modal -->
    <div id="winnerModal" class="modal-hidden fixed inset-0 z-50 bg-black bg-opacity-80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-emerald-500 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold text-slate-300 mb-2">الفائز هو!</h2>
            <p id="winnerName" class="text-4xl font-black text-emerald-400 mb-8 py-4"></p>
            <button id="closeModalBtn" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-lg transition-colors">
                إغلاق
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const namesList = document.getElementById('namesList');
        const spinBtn = document.getElementById('spinBtn');
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameEl = document.getElementById('winnerName');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let names = [];
        let isSpinning = false;
        let currentRotation = 0; // Current angle in radians
        
        // Colors for slices
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', 
            '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', 
            '#d946ef', '#f43f5e'
        ];

        // The Secret Winners Array
        const SECRET_WINNERS = [
            'هبه حسين احمد محمد البربير',
            'ياسمينا ابراهيم محمود محمد محمد جباره',
            'جنى ياسر محمد ابوالعزم بسيوني'
        ];

        /**
         * Normalizes Arabic text to ensure perfect matching
         * - Removes all whitespace
         * - Converts أ, إ, آ to ا
         * - Converts ة to ه
         * - Converts ى to ي
         */
        function normalizeArabic(text) {
            if (!text) return "";
            return text
                .replace(/\s+/g, '')       // Remove all spaces/tabs/newlines completely
                .replace(/[أإآ]/g, 'ا')   // Normalize Alef
                .replace(/ة/g, 'ه')       // Normalize Teh Marbuta
                .replace(/ى/g, 'ي');      // Normalize Alef Maksura
        }

        const normalizedSecretWinners = SECRET_WINNERS.map(normalizeArabic);

        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            
            // Arpeggio
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        function resizeCanvas() {
            // Set internal resolution higher for crisp text
            const size = canvas.parentElement.clientWidth;
            canvas.width = size * 2;
            canvas.height = size * 2;
            drawWheel();
        }

        window.addEventListener('resize', resizeCanvas);

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, width, height);

            if (names.length === 0) {
                // Draw empty wheel
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#334155';
                ctx.fill();
                
                ctx.fillStyle = '#94a3b8';
                ctx.font = `bold ${width/20}px Cairo`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('أضف أسماء لتبدأ', centerX, centerY);
                return;
            }

            const sliceAngle = (2 * Math.PI) / names.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            for (let i = 0; i < names.length; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#1e293b';
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right'; // RTL aligns to the right side of the canvas context
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${radius / 10}px Cairo`;
                
                // Shadow for text readability
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                // Truncate long names
                let displayName = names[i];
                if (displayName.length > 20) displayName = displayName.substring(0, 17) + '...';

                // Calculate distance from center to start writing (give space for inner circle)
                const textX = radius - 30; 
                ctx.fillText(displayName, textX, 0);
                ctx.restore();
            }

            // Draw center dot
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.15, 0, 2 * Math.PI);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            ctx.restore();
        }

        // Update names array when textarea changes
        namesList.addEventListener('input', () => {
            if (isSpinning) return;
            const text = namesList.value;
            names = text.split('\n').map(n => n.trim()).filter(n => n !== '');
            drawWheel();
        });

        
        // Easing function: easeOutCubic
        function easeOut(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning || names.length === 0) return;
            
            initAudio(); // Initialize audio context on user interaction
            
            isSpinning = true;
            spinBtn.disabled = true;
            namesList.disabled = true;

            // 1. Determine Target
            let targetIndex = -1;
            const presentSecretsIndices = [];

            // Check every name against normalized secret winners
            names.forEach((name, index) => {
                const normName = normalizeArabic(name);
                if (normalizedSecretWinners.includes(normName)) {
                    presentSecretsIndices.push(index);
                }
            });

            if (presentSecretsIndices.length > 0) {
                // One or more secret winners found! Pick one randomly from the found ones.
                const randChoice = Math.floor(Math.random() * presentSecretsIndices.length);
                targetIndex = presentSecretsIndices[randChoice];
            } else {
                // No secret winners, pick completely random
                targetIndex = Math.floor(Math.random() * names.length);
            }

            // 2. Calculate Angles
            const sliceAngle = (2 * Math.PI) / names.length;
            
            // We want the target slice to end up at the pointer (0 radians / Right side).
            // Current rotation of the target slice's middle is: targetIndex * sliceAngle + sliceAngle/2
            // To make it land at 0, we need to add rotation such that it equals a multiple of 2PI.
            // A random offset ensures the pointer doesn't land perfectly in the middle every time.
            const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.7); // 70% of the slice width
            
            const targetMiddleAngle = targetIndex * sliceAngle + sliceAngle / 2;
            
            // Add extra full rotations for dramatic effect (5 to 10 full spins)
            const extraSpins = Math.floor(Math.random() * 5) + 5; 
            const totalRotationNeeded = (extraSpins * 2 * Math.PI) + (2 * Math.PI - targetMiddleAngle) + randomOffset;
            
            const startRotation = currentRotation % (2 * Math.PI); // Normalize current rotation
            const finalRotation = startRotation + totalRotationNeeded;

            // 3. Animation Loop
            const duration = 6000; // 6 seconds
            const startTime = performance.now();
            let lastTickRotation = startRotation;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                // Apply easing
                const easedProgress = easeOut(progress);
                
                currentRotation = startRotation + (totalRotationNeeded * easedProgress);
                drawWheel();

                // Sound Effect Logic (play a tick when passing a slice boundary)
                // We track how many slices have passed
                const currentSliceTick = Math.floor((currentRotation) / sliceAngle);
                const lastSliceTick = Math.floor((lastTickRotation) / sliceAngle);
                
                if (currentSliceTick > lastSliceTick) {
                    playTickSound();
                }
                lastTickRotation = currentRotation;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Spin Finished!
                    isSpinning = false;
                    spinBtn.disabled = false;
                    namesList.disabled = false;
                    
                    showWinner(names[targetIndex]);
                }
            }
            
            requestAnimationFrame(animate);
        });

        function showWinner(winnerName) {
            playWinSound();
            
            winnerNameEl.textContent = winnerName;
            winnerModal.classList.remove('modal-hidden');
            winnerModal.classList.add('modal-visible');
            
            // Fire Confetti
            const end = Date.now() + 3 * 1000;
            const colors = ['#10b981', '#3b82f6', '#f59e0b'];

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        closeModalBtn.addEventListener('click', () => {
            winnerModal.classList.add('modal-hidden');
            winnerModal.classList.remove('modal-visible');
        });

        // Initial setup
        // Set default text for testing
        namesList.value = "يوسف\nمريم\nأحمد\nمحمد\nعلي\nعمر\nمصطفى";
        
        // Trigger initial input event to populate names array and draw
        namesList.dispatchEvent(new Event('input'));
        
        // Ensure initial sizing is correct
        setTimeout(resizeCanvas, 100);
        
    </script>
</body>
</html>
