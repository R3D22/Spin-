<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة السحب الذكية</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            overflow: hidden; /* Prevent scrolling on desktop */
        }
        
        #wheel-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0,0,0,0.5);
            border: 10px solid #334155;
            background-color: #1e293b;
        }

        /* The pointer/arrow on the right side (0 degrees) */
        #pointer {
            position: absolute;
            top: 50%;
            right: -25px;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-right: 40px solid #ef4444; /* Tailwind red-500 */
            z-index: 10;
            filter: drop-shadow(-2px 4px 6px rgba(0,0,0,0.4));
        }

        /* Inner center circle overlay */
        .wheel-center-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 20%;
            background: radial-gradient(circle, #e2e8f0, #94a3b8);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 4px solid #334155;
        }

        .modal-hidden {
            display: none !important;
        }

        .modal-visible {
            display: flex !important;
            animation: fadeIn 0.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Spin button pulse effect */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .btn-pulse:not(:disabled) {
            animation: pulse-soft 2s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    
    <!-- Settings Button (Gear Icon) - Subtle in the top corner -->
    <button id="openSettingsBtn" class="absolute top-4 right-4 md:top-6 md:right-6 p-3 text-slate-500 hover:text-slate-300 transition-colors rounded-full hover:bg-slate-800/50 focus:outline-none z-20">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <!-- Main Content: Wheel and Spin Button -->
    <div class="flex flex-col items-center justify-center w-full px-4 gap-10 mt-8">
        
        <!-- Wheel -->
        <div id="wheel-container" class="drop-shadow-2xl">
            <div id="pointer"></div>
            <div class="wheel-center-overlay"></div>
            <canvas id="wheel"></canvas>
        </div>

        <!-- Spin Button -->
        <button id="spinBtn" class="btn-pulse w-full max-w-xs py-4 px-8 text-2xl font-black bg-gradient-to-b from-blue-500 to-blue-700 hover:from-blue-400 hover:to-blue-600 text-white rounded-full shadow-[0_8px_0_#1e3a8a,0_15px_20px_rgba(0,0,0,0.4)] active:shadow-[0_0px_0_#1e3a8a,0_0px_0px_rgba(0,0,0,0)] active:translate-y-[8px] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none tracking-wider">
            السحب!
        </button>
    </div>

    
    <!-- Settings Modal (Hidden by default) -->
    <div id="settingsModal" class="modal-hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-2xl shadow-2xl w-full max-w-md flex flex-col gap-4 relative">
            <h2 class="text-2xl font-bold text-white mb-2">إعدادات العجلة</h2>
            
            <label for="namesList" class="text-sm font-bold text-slate-300">قائمة الأسماء (اسم في كل سطر):</label>
            <textarea id="namesList" rows="10" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none font-medium text-lg leading-relaxed" placeholder="أدخل الأسماء هنا..."></textarea>
            
            <button id="closeSettingsBtn" class="w-full py-3 mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-lg font-bold rounded-xl shadow-lg transition-colors">
                حفظ وإغلاق
            </button>
        </div>
    </div>

    <!-- Winner Modal (Hidden by default) -->
    <div id="winnerModal" class="modal-hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-emerald-500 p-8 rounded-3xl shadow-[0_0_50px_rgba(16,185,129,0.3)] max-w-md w-full text-center transform transition-all">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-2xl font-bold text-slate-300 mb-2">الفائز هو!</h2>
            <p id="winnerName" class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-8 py-4 leading-tight"></p>
            <button id="closeModalBtn" class="w-full py-4 bg-slate-700 hover:bg-slate-600 text-white text-xl font-bold rounded-xl transition-colors shadow-lg">
                استمرار
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const namesList = document.getElementById('namesList');
        const spinBtn = document.getElementById('spinBtn');
        
        // Modals & Buttons
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameEl = document.getElementById('winnerName');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        const settingsModal = document.getElementById('settingsModal');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');

        let names = [];
        let isSpinning = false;
        let currentRotation = 0; 
        
        // Vibrant modern colors for slices
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', 
            '#10b981', '#06b6d4', '#3b82f6', '#6366f1', 
            '#8b5cf6', '#d946ef', '#f43f5e'
        ];

        // --- SECRET RIGGING LOGIC ---
        const SECRET_WINNERS = [
            'هبه حسين احمد محمد البربير',
            'ياسمينا ابراهيم محمود محمد محمد جباره',
            'جنى ياسر محمد ابوالعزم بسيوني'
        ];

        /**
         * Robust Arabic Text Normalization
         * Strips ALL spaces, standardizes Alef, Teh Marbuta, and Alef Maksura
         */
        function normalizeArabic(text) {
            if (!text) return "";
            return text
                .replace(/\s+/g, '')       // Remove all whitespaces completely
                .replace(/[أإآ]/g, 'ا')   // Normalize Alef
                .replace(/ة/g, 'ه')       // Normalize Teh Marbuta
                .replace(/ى/g, 'ي');      // Normalize Alef Maksura
        }

        const normalizedSecretWinners = SECRET_WINNERS.map(normalizeArabic);
        // -----------------------------

        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playWinSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'triangle';
                
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 1);
            } catch (e) {}
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = container.clientWidth;
            // High DPI scaling for crisp text
            canvas.width = size * 2;
            canvas.height = size * 2;
            drawWheel();
        }

        window.addEventListener('resize', () => {
            if(!isSpinning) resizeCanvas();
        });

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 5; // Slight padding

            ctx.clearRect(0, 0, width, height);

            if (names.length === 0) {
                // Empty state
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                
                ctx.fillStyle = '#64748b';
                ctx.font = `bold ${width/22}px Cairo`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('أضف أسماء من الإعدادات ⚙️', centerX, centerY);
                return;
            }

            const sliceAngle = (2 * Math.PI) / names.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            for (let i = 0; i < names.length; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#1e293b';
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right'; 
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                
                // Scale font based on number of slices
                const fontSize = Math.max(16, Math.min(radius / 8, (radius * sliceAngle) / 2.5));
                ctx.font = `bold ${fontSize}px Cairo`;
                
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                let displayName = names[i];
                if (displayName.length > 18) displayName = displayName.substring(0, 16) + '..';

                const textX = radius - 20; // Margin from edge
                ctx.fillText(displayName, textX, 0);
                ctx.restore();
            }

            ctx.restore();
        }

        
        function updateNamesList() {
            const text = namesList.value;
            names = text.split('\n').map(n => n.trim()).filter(n => n !== '');
            drawWheel();
        }

        openSettingsBtn.addEventListener('click', () => {
            if(isSpinning) return;
            settingsModal.classList.remove('modal-hidden');
            settingsModal.classList.add('modal-visible');
            namesList.focus();
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('modal-hidden');
            settingsModal.classList.remove('modal-visible');
            updateNamesList();
        });

        // Easing function: easeOutQuart for smooth deceleration
        function easeOut(t) {
            return 1 - Math.pow(1 - t, 4);
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning || names.length === 0) return;
            
            initAudio(); 
            
            isSpinning = true;
            spinBtn.disabled = true;
            openSettingsBtn.style.opacity = '0.5';
            openSettingsBtn.style.pointerEvents = 'none';

            // 1. Determine Target (RIGGING LOGIC)
            let targetIndex = -1;
            const presentSecretsIndices = [];

            // Search input list for any of the secret winners
            names.forEach((name, index) => {
                const normName = normalizeArabic(name);
                if (normalizedSecretWinners.includes(normName)) {
                    presentSecretsIndices.push(index);
                }
            });

            if (presentSecretsIndices.length > 0) {
                // Pick randomly ONLY from the matched secret winners
                const randChoice = Math.floor(Math.random() * presentSecretsIndices.length);
                targetIndex = presentSecretsIndices[randChoice];
            } else {
                // Normal random spin
                targetIndex = Math.floor(Math.random() * names.length);
            }

            // 2. Calculate Angles
            const sliceAngle = (2 * Math.PI) / names.length;
            
            // Random offset so it doesn't land exactly in the center of the slice every time
            const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.8); 
            
            const targetMiddleAngle = targetIndex * sliceAngle + sliceAngle / 2;
            
            // Add extra spins (between 6 and 10)
            const extraSpins = Math.floor(Math.random() * 5) + 6; 
            const totalRotationNeeded = (extraSpins * 2 * Math.PI) + (2 * Math.PI - targetMiddleAngle) + randomOffset;
            
            const startRotation = currentRotation % (2 * Math.PI); 
            const finalRotation = startRotation + totalRotationNeeded;

            // 3. Animation Loop
            const duration = 7000; // 7 seconds
            const startTime = performance.now();
            let lastTickRotation = startRotation;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                const easedProgress = easeOut(progress);
                
                currentRotation = startRotation + (totalRotationNeeded * easedProgress);
                drawWheel();

                // Play tick sound when passing a slice boundary
                const currentSliceTick = Math.floor(currentRotation / sliceAngle);
                const lastSliceTick = Math.floor(lastTickRotation / sliceAngle);
                
                if (currentSliceTick > lastSliceTick) {
                    playTickSound();
                }
                lastTickRotation = currentRotation;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Spin Finished!
                    isSpinning = false;
                    spinBtn.disabled = false;
                    openSettingsBtn.style.opacity = '1';
                    openSettingsBtn.style.pointerEvents = 'auto';
                    
                    showWinner(names[targetIndex]);
                }
            }
            
            requestAnimationFrame(animate);
        });

        function showWinner(winnerName) {
            playWinSound();
            
            winnerNameEl.textContent = winnerName;
            winnerModal.classList.remove('modal-hidden');
            winnerModal.classList.add('modal-visible');
            
            // Confetti explosion
            const end = Date.now() + 3000;
            const colors = ['#10b981', '#06b6d4', '#f59e0b', '#ef4444'];

            (function frame() {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0 },
                    colors: colors,
                    zIndex: 100
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1 },
                    colors: colors,
                    zIndex: 100
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        closeModalBtn.addEventListener('click', () => {
            winnerModal.classList.add('modal-hidden');
            winnerModal.classList.remove('modal-visible');
        });

        // Initialize empty state visually
        setTimeout(resizeCanvas, 100);
        
    </script>
</body>
</html>
